# Path: Cargo.toml
# Project: Gospelio Radio Player

[package]
name = "gospelio"
version = "0.1.0"
edition = "2021"
authors = ["Andrii Didenkul <didencool+gospelio@gmail.com>"]
description = "A lightweight cross-platform christian radio player"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
# GUI фреймворк Slint
slint = "1.17.1"

# Аудіо-двигун для декодування (MP3, Vorbis, FLAC)
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "vorbis", "flac"] }

# HTTP-запити для завантаження списку станцій / аудіопотоку
ureq = { version = "3.4.0", features = ["json"] }

# Серіалізація конфігурації (config.toml)
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

# Робота з шляхами системних конфігів (~/.config/gospelio)
directories = "6.0.0"

# Логування
log = "0.4"
env_logger = "0.11.0"

i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
rust-embed = "8.5"
unic-langid = "0.9"

# Специфічні залежності під Linux (Sway / Wayland / Waybar StatusNotifierItem)
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

# База під майбутній Android
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[build-dependencies]
slint-build = "1.17.1"
